name: Release

# Tag-driven: `npm run release -- patch` writes the versions and cuts the tag,
# `git push --follow-tags` starts this. The tag is the only trigger that can
# publish, so nothing reaches npm without a commit that names the version.
on:
    push:
        tags: ['v*.*.*']
    workflow_dispatch:
        inputs:
            tag:
                description: An existing tag to (re)publish, e.g. v1.0.1
                required: true

permissions:
    contents: read

# Two tags pushed together published concurrently and the registry answered
# `409 Failed to save packument`. Releases run one at a time; never cancel one.
concurrency:
    group: release
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: npm
        permissions:
            contents: write # create the GitHub release
            id-token: write # npm provenance / trusted publishing
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ inputs.tag || github.ref }}
                  fetch-depth: 0

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
                  registry-url: https://registry.npmjs.org

            # Trusted publishing (OIDC) needs npm >= 11.5.1.
            - run: npm i -g npm@latest

            - run: npm ci

            - name: The tag must match the versions in the tree
              run: node scripts/release.mjs verify "${{ inputs.tag || github.ref_name }}"

            - run: npm run format:check
            - run: npm run typecheck
            # Live tests talk to real providers and need credentials; they are
            # excluded here rather than skipped, so a missing key is not a pass.
            - run: npx vitest run --exclude '**/live-*'

            - name: Pack every package (dry run)
              run: npm pack --dry-run $(node scripts/release.mjs workspaces)

            # One workspace at a time, in dependency order, skipping whatever the
            # registry already has — re-running after a partial failure has to be
            # able to finish. No --provenance: npm rejects it (422) unless the
            # source repository is public. Add it back here if this repo is opened up.
            # `tr | grep` because re-running an OLD tag checks out that tag's
            # release.mjs, which may predate --paths and print `-w <dir>` pairs.
            - name: Publish to npm
              run: |
                  for dir in $(node scripts/release.mjs workspaces --paths | tr ' ' '\n' | grep '^packages/'); do
                      name=$(node -p "require('./$dir/package.json').name")
                      version=$(node -p "require('./$dir/package.json').version")
                      if npm view "$name@$version" version > /dev/null 2>&1; then
                          echo "already published: $name@$version"
                      else
                          npm publish -w "$dir" --access public
                      fi
                  done
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: GitHub release
              run: gh release create "$TAG" --generate-notes --title "$TAG"
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ inputs.tag || github.ref_name }}

    # Images built from what was just published to npm, for amd64 and arm64, so zen
    # pulls them instead of building them on every machine:
    #   zenera-agent-runtime  what `zen server build` copies into every agent image
    #                         (node, the @zenera packages, bwrap; packages/cli/src/container.ts)
    #   zenera-sandbox        the base a project's sandbox/Dockerfile starts FROM
    #                         (python, node, the npm packages, zen; packages/sandbox/src/base.ts)
    # zen builds either itself when it cannot pull it, so a failure here slows builds, it
    # breaks nothing.
    images:
        needs: publish
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: zenera-agent-runtime
                      dir: packages/cli
                      dockerfile: agent-runtime.Dockerfile
                      needs: '@zenera/cli'
                    - name: zenera-sandbox
                      dir: packages/sandbox
                      dockerfile: sandbox-base.Dockerfile
                      needs: '@zenera/cli @zenera/rag'
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ inputs.tag || github.ref }}

            - name: Version and image
              id: v
              run: |
                  version=$(node -p "require('./packages/cli/package.json').version")
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "image=ghcr.io/zenera-ai/${{ matrix.name }}:$version" >> "$GITHUB_OUTPUT"

            # npm can take a minute to serve a version it has just accepted.
            - name: Wait for the packages on npm
              run: |
                  for pkg in $NEEDS; do
                      for i in $(seq 1 120); do
                          npm view "$pkg@$VERSION" version > /dev/null 2>&1 && continue 2
                          sleep 10
                      done
                      echo "$pkg@$VERSION is not on npm" && exit 1
                  done
              env:
                  VERSION: ${{ steps.v.outputs.version }}
                  NEEDS: ${{ matrix.needs }}

            - uses: docker/setup-qemu-action@v3
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}

            # Skips a version already pushed (re-runs), and tags older than the Dockerfile.
            # The build cache lives next to the images (<image>:buildcache, every stage: mode=max):
            # without it each release rebuilt every layer, and the sandbox base's third-party
            # `npm install -g` (~585 MB) came out as a new layer every time, so every machine and
            # cache pulled ~1 GB again per zen release. With it, a release rebuilds only the steps
            # from `ARG ZEN_VERSION` on, and pulls fetch just those layers.
            - name: Build and push
              run: |
                  if [ ! -f "$DIR/$DOCKERFILE" ]; then
                      echo "no $DIR/$DOCKERFILE at this tag" && exit 0
                  fi
                  if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
                      echo "already pushed: $IMAGE" && exit 0
                  fi
                  docker buildx build --platform linux/amd64,linux/arm64 \
                      --build-arg ZEN_VERSION="$VERSION" \
                      --cache-from "type=registry,ref=$CACHE" \
                      --cache-to "type=registry,ref=$CACHE,mode=max,oci-mediatypes=true,image-manifest=true" \
                      -f "$DIR/$DOCKERFILE" -t "$IMAGE" --push "$DIR"
              env:
                  VERSION: ${{ steps.v.outputs.version }}
                  IMAGE: ${{ steps.v.outputs.image }}
                  CACHE: ghcr.io/zenera-ai/${{ matrix.name }}:buildcache
                  DIR: ${{ matrix.dir }}
                  DOCKERFILE: ${{ matrix.dockerfile }}
