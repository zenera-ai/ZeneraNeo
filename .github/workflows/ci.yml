name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run format:check
            - run: npm run typecheck
            - run: npx vitest run --exclude '**/live-*'

    # BwrapSandbox against a real bubblewrap. Ubuntu 24.04 closes unprivileged
    # user namespaces through AppArmor; containers (the agent image) do not.
    bwrap:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
            - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            - run: npx vitest run packages/sandbox/test/live-bwrap.test.ts
