name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

jobs:
    format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run format:check

    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run typecheck

    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2]
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: npx vitest run --exclude '**/live-*' --shard=${{ matrix.shard }}/2

    # BwrapSandbox, and the server running a turn through it, against a real
    # bubblewrap. Ubuntu 24.04 closes unprivileged user namespaces through
    # AppArmor; containers (the agent image) do not.
    bwrap:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
            - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            - run: npx tsc -b tsconfig.build.json
            - run: npx vitest run packages/sandbox/test/live-bwrap.test.ts packages/server/test/server.test.ts
