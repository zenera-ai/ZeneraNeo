<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Items</title>
        <!-- Calls the functions of api/*.api.py: api('api/items').add_item({...}). Keep it. -->
        <script src="api.js"></script>
        <style>
            :root {
                color-scheme: light dark;
                --bg: #f7f7f8;
                --card: #ffffff;
                --fg: #1d1d1f;
                --muted: #6e6e73;
                --line: #e3e3e6;
                --accent: #2563eb;
                --danger: #b91c1c;
                --gap: 16px;
                --radius: 10px;
                font:
                    14px/1.45 system-ui,
                    -apple-system,
                    'Segoe UI',
                    Roboto,
                    sans-serif;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #141416;
                    --card: #1e1e21;
                    --fg: #ececf0;
                    --muted: #9a9aa2;
                    --line: #2e2e33;
                    --accent: #60a5fa;
                    --danger: #f87171;
                }
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--fg);
            }
            main {
                max-width: 900px;
                margin: 0 auto;
                padding: var(--gap);
                display: grid;
                gap: var(--gap);
            }
            header h1 {
                margin: 0;
                font-size: 1.4rem;
            }
            header p {
                margin: 4px 0 0;
                color: var(--muted);
            }
            .card {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: var(--radius);
                padding: var(--gap);
                min-width: 0;
            }
            .row {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                align-items: center;
            }
            .row > * {
                min-width: 0;
            }
            input[type='text'],
            select,
            button {
                font: inherit;
                color: var(--fg);
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 6px;
                padding: 6px 10px;
            }
            input[type='text'] {
                flex: 1 1 14rem;
            }
            button {
                cursor: pointer;
            }
            button.primary {
                background: var(--accent);
                border-color: var(--accent);
                color: #fff;
            }
            button.danger {
                color: var(--danger);
            }
            button:disabled {
                opacity: 0.6;
                cursor: default;
            }
            ul.list {
                list-style: none;
                margin: 0;
                padding: 0;
            }
            ul.list li {
                display: flex;
                gap: 10px;
                align-items: center;
                padding: 8px 0;
                border-bottom: 1px solid var(--line);
            }
            ul.list li:last-child {
                border-bottom: 0;
            }
            ul.list .title {
                flex: 1;
                min-width: 0;
                overflow-wrap: anywhere;
            }
            ul.list .done .title {
                color: var(--muted);
                text-decoration: line-through;
            }
            .muted {
                color: var(--muted);
            }
            .error {
                color: var(--danger);
                border-color: var(--danger);
            }
            [hidden] {
                display: none !important;
            }
        </style>
    </head>
    <body>
        <main>
            <header>
                <h1 id="title">Items</h1>
                <p id="subtitle">Add, check off and remove items. Changes are saved.</p>
                <p id="user" class="muted" hidden></p>
            </header>

            <!-- The page: replace from here -->
            <div id="error" class="card error" role="alert" hidden></div>

            <section class="card">
                <div class="row">
                    <input id="new-title" type="text" placeholder="New item" maxlength="200" />
                    <button id="add" class="primary">Add</button>
                    <select id="show" aria-label="Show">
                        <option value="all">All</option>
                        <option value="open">Open</option>
                        <option value="done">Done</option>
                    </select>
                </div>
            </section>

            <section class="card">
                <p id="status" class="muted">Loading…</p>
                <ul id="items" class="list"></ul>
            </section>
        </main>

        <script>
            const items = api('api/items');
            const state = { show: 'all', list: [], loading: true };
            const $ = (id) => document.getElementById(id);

            function showError(err) {
                const box = $('error');
                box.textContent = err ? err.message || String(err) : '';
                box.hidden = !err;
            }

            // Every change goes through here: call, then reload and draw, or show what failed.
            async function run(work) {
                showError(null);
                try {
                    await work();
                    await reload();
                } catch (err) {
                    showError(err);
                }
            }

            async function reload() {
                state.loading = true;
                render();
                try {
                    state.list = await items.list_items({ show: state.show });
                } finally {
                    state.loading = false;
                    render();
                }
            }

            function render() {
                $('status').textContent = state.loading
                    ? 'Loading…'
                    : state.list.length
                      ? `${state.list.length} item${state.list.length === 1 ? '' : 's'}`
                      : 'Nothing here yet.';
                const ul = $('items');
                ul.replaceChildren(
                    ...state.list.map((item) => {
                        const li = document.createElement('li');
                        li.className = item.done ? 'done' : '';
                        const box = document.createElement('input');
                        box.type = 'checkbox';
                        box.checked = item.done;
                        box.ariaLabel = 'Done';
                        box.addEventListener('change', () =>
                            run(() => items.set_done({ id: item.id, done: box.checked })),
                        );
                        const title = document.createElement('span');
                        title.className = 'title';
                        title.textContent = item.title;
                        // No dialogs: the sandbox blocks them. A second click confirms.
                        const del = document.createElement('button');
                        del.className = 'danger';
                        del.textContent = 'Delete';
                        del.addEventListener('click', () => {
                            if (del.dataset.armed)
                                return run(() => items.remove_item({ id: item.id }));
                            del.dataset.armed = '1';
                            del.textContent = 'Sure?';
                            setTimeout(() => {
                                delete del.dataset.armed;
                                del.textContent = 'Delete';
                            }, 3000);
                        });
                        li.append(box, title, del);
                        return li;
                    }),
                );
            }

            async function add() {
                const input = $('new-title');
                const title = input.value.trim();
                if (!title) return;
                $('add').disabled = true;
                await run(async () => {
                    await items.add_item({ title });
                    input.value = '';
                });
                $('add').disabled = false;
                input.focus();
            }

            $('add').addEventListener('click', add);
            $('new-title').addEventListener('keydown', (e) => e.key === 'Enter' && add());
            $('show').addEventListener('change', (e) => {
                state.show = e.target.value;
                run(async () => {});
            });

            // Who is signed in comes from the server (me() in api/items.api.py), never the page.
            items
                .me()
                .then((me) => {
                    if (!me) return;
                    $('user').textContent = `Signed in as ${me.name}`;
                    $('user').hidden = false;
                })
                .catch(showError);

            run(async () => {});
        </script>
    </body>
</html>
